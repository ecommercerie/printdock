name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Run tests
        run: go test ./...

  release:
    runs-on: windows-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest

      - name: Build Windows binary
        timeout-minutes: 10
        run: wails build -platform windows/amd64 -skipbindings
        env:
          CGO_ENABLED: "1"

      - name: Create ZIP archive
        run: Compress-Archive -Path build/bin/printdock.exe -DestinationPath printdock-${{ github.ref_name }}-windows-amd64.zip

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            printdock-${{ github.ref_name }}-windows-amd64.zip
            build/bin/printdock.exe
